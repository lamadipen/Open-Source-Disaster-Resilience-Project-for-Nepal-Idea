name: Bug Report or Feature Request
description: Report a bug or suggest a new feature for existing tracks.
title: "[Issue]: "
labels: ["bug", "enhancement"]
body:
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      options:
        - Bug Report
        - Feature Request
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug or feature request.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce (if bug)
      description: How can we see the issue ourselves?
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen instead?
